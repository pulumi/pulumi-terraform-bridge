[env]
_.vfox-pulumi = { module_path = "" } # Sets GO_VERSION_MISE and PULUMI_VERSION_MISE
PULUMI_HOME = "{{config_root}}/.pulumi"
PULUMI_DISABLE_AUTOMATIC_PLUGIN_ACQUISITION = "true"
# Prefer the local links even when inherited PATH entries contain other versions.
_.path = ["{{config_root}}/.pulumi/plugins/bin"]
PULUMI_IGNORE_AMBIENT_PLUGINS = false

[tools]
# Runtimes
go = "{{ env.GO_VERSION_MISE }}"
# Executable tools
golangci-lint = '2.9.0'
pulumi = "{{ env.PULUMI_VERSION_MISE }}"
terraform = 'latest'

# External test dependencies. Keep normal tests and golden acceptance on the same pins.
"vfox-pulumi:pulumi/pulumi-converter-terraform" = "1.0.20"
"vfox-pulumi:pulumi/pulumi-random" = "4.16.3"
"vfox-pulumi:pulumi/pulumi-aws" = "6.22.2"
"vfox-pulumi:pulumi/pulumi-archive" = "0.0.4"
"vfox-pulumi:pulumi/pulumi-wavefront" = "3.0.0"
"vfox-pulumi:pulumi/pulumi-auth0" = "3.16.0"
"vfox-pulumi:pulumi/pulumi-http" = "0.0.11"
"vfox-pulumi:pulumi/pulumi-gcp" = "8.22.0"
"vfox-pulumi:equinix/pulumi-equinix" = "0.6.0"

[hooks]
postinstall = "mise run sync-plugins"

[tasks.sync-plugins]
description = "Reset the local Pulumi plugin directory to the mise pins. Run before tests, never during them."
run = 'go run "{{config_root}}/scripts/sync-plugins/main.go"'

[plugins]
vfox-pulumi = "https://github.com/pulumi/vfox-pulumi"
